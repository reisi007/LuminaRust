name: CI image (LibRaw)

# Builds the pinned CI image (docker/Dockerfile) — LibRaw 0.22.2 plus the
# distro liblensfun — and publishes it to GHCR. The main CI workflow (ci.yml)
# runs its Rust job inside this container so the native LibRaw version is
# deterministic (0.22.2, same as Homebrew on developer machines) without
# rebuilding LibRaw from source on every run. liblensfun is also installed
# from the distro (no separate pin) so the `lumina-lensfun` / `lumina-core`
# lensfun feature can be exercised in CI (F-098-N3).
#
# Rebuilt only when the Dockerfile or this workflow changes; workflow_dispatch
# allows a manual refresh. Published tags (GHCR names must be lowercase):
#   - <commit-sha>: immutable per build — reproducible pull by SHA
#   - latest:       moving alias that ci.yml references
# The LibRaw version is recorded in the OCI label `lumina.libraw_version`.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile
      - .github/workflows/ci-libraw-image.yml

permissions:
  contents: read
  packages: write
  # Allows the final step to dispatch ci.yml after the image was published, so
  # the main CI run can never race the image build (see dispatch step below).
  actions: write

jobs:
  build:
    name: Build and publish LibRaw 0.22.2 CI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/reisi007/luminarust/lumina-ci:latest
            ghcr.io/reisi007/luminarust/lumina-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=LuminaRust CI image with pinned LibRaw 0.22.2 and distro liblensfun (autotools build)
            lumina.libraw_version=0.22.2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ordering guarantee against the image/CI race: when this workflow is
      # triggered by a push (i.e. a docker/Dockerfile or this workflow change
      # landed on main), ci.yml does NOT run from the push itself (see its
      # `paths-ignore` for docker/**). Instead we publish the image FIRST and
      # then dispatch ci.yml, so the CI jobs always pull the freshly built
      # `latest` image that contains liblensfun + pinned LibRaw 0.22.2.
      # Manual `workflow_dispatch` refreshes of the image deliberately do not
      # re-dispatch CI.
      - name: Dispatch main CI after image publish
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'main',
            })
