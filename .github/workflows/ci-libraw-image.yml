name: CI image (LibRaw)

# Builds the pinned-LibRaw CI image (docker/Dockerfile) and publishes it to
# GHCR. The main CI workflow (ci.yml) runs its Rust job inside this container
# so the native LibRaw version is deterministic (0.22.2, same as Homebrew on
# developer machines) without rebuilding LibRaw from source on every run.
#
# The image is rebuilt only when the Dockerfile or this workflow changes;
# `workflow_dispatch` also allows a manual refresh.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile
      - .github/workflows/ci-libraw-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish LibRaw 0.22.2 CI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # GHCR image names must be lowercase; keep in sync with ci.yml.
          tags: ghcr.io/reisi007/luminarust/lumina-ci:libraw-0.22.2
          cache-from: type=gha
          cache-to: type=gha,mode=max