name: CI

on:
  push:
    branches: [main, master]
    # Dockerfile / image-workflow changes are NOT run via the push trigger:
    # the CI image workflow (ci-libraw-image.yml) builds+publishes the image
    # first and then dispatches this workflow, so the container jobs always
    # pull the freshly built image (no image/CI race). Paths that are not
    # docker/** still ride the push trigger directly.
    paths-ignore:
      - 'docker/**'
      - '.github/workflows/ci-libraw-image.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Used by the rust job to authenticate the GHCR container pull
  # (`container.credentials`); the image is public, this only future-proofs
  # the pull for private mirrors.
  packages: read

jobs:
  detect:
    name: Detect Rust workspace
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.workspace.outputs.has_cargo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Cargo manifest
        id: workspace
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust checks
    needs: detect
    # The repository starts with architecture and feature documents. The Rust
    # checks become active automatically once the Cargo workspace is present.
    if: needs.detect.outputs.has_cargo == 'true'
    # Runs inside the pinned-LibRaw image built by ci-libraw-image.yml
    # (ghcr.io/reisi007/luminarust/lumina-ci:latest; the LibRaw version 0.22.2
    # is recorded in the OCI label `lumina.libraw_version`). This gives the
    # runner the same LibRaw version (0.22.2) as local Homebrew installs, so
    # the RAW golden fixture dimensions are deterministic across environments
    # (LibRaw 0.21.x decodes CR3 as 6160x4144, 0.22.x as 6032x4024).
    # Ordering: docker/** pushes are handled by the image workflow which
    # dispatches this workflow only AFTER publishing the image, so `latest`
    # always contains liblensfun + pinned LibRaw when this job runs.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reisi007/luminarust/lumina-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TERM_COLOR: always
      # NOTE: RUSTFLAGS="-D warnings" is intentionally NOT set here. The strict
      # lint gate is the dedicated Clippy step below, which runs `-D warnings`
      # on workspace crates only; the vendored `libraw-sys` build script is
      # lint-excluded there on purpose (it is not a workspace member).

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --all-targets

      # vendor/libraw-sys is intentionally NOT a workspace member, so the
      # `cargo test --workspace` above never enters it. These ABI-layout
      # asserts (build-time C _Static_assert + Rust const-asserts + runtime
      # crosscheck) are the regression net for REVIEW-RAW-ABI-1 and must run
      # in CI. The CI container ships LibRaw 0.22.2 (OCI label
      # lumina.libraw_version), satisfying the build.rs version gate.
      - name: Run vendored libraw-sys ABI tests
        run: cargo test -p libraw-sys

      - name: Run native zdata tests
        run: cargo test -p lumina-sidecar --features zdata

      - name: Run Lensfun feature tests
        # liblensfun is now installed in the CI container (see docker/Dockerfile,
        # ci-libraw-image.yml). This step covers the `lumina-lensfun` FFI
        # (`native` feature) plus the `lumina-core` `lensfun` pipeline
        # integration (byte-identical fallback + real distortion/vignette
        # correction against the system Lensfun database). Per F-098-N3 / M2 we
        # do NOT build the whole workspace with mixed features; the two crates
        # are selected explicitly with their synchronized features.
        run: cargo test -p lumina-lensfun --features native -p lumina-core --features lensfun

      # Clippy on workspace crates only, with `-D warnings`. We do NOT use
      # `--all-features` here: `lumina-gpu/gpu` remains the only hard CI
      # exclusion (requires Metal hardware; only `cargo check -p lumina-gpu
      # --features gpu` in CI, see below). `lumina-onnx/onnx-rt` IS now
      # CI-checked: the image ships `libssl-dev` + `clang` for `openssl-sys`
      # and CI runners have network to fetch the `ort` prebuilt ONNX Runtime
      # binaries (see crates/lumina-onnx/Cargo.toml). The dedicated
      # `onnx-rt` Clippy/Test steps below cover that path separately so the
      # workspace clippy stays focused on pure-Rust features:
      #   - lumina-sidecar/zdata (zstd-compressed binary sidecar)
      #   - lumina-bench/raw-bench (LibRaw decode benchmarks)
      # Only GPU stays hard CI-excluded; onnx-rt has no runner-hardware reason.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features "lumina-sidecar/zdata,lumina-bench/raw-bench" -- -D warnings

      # The workspace Clippy above enables only the zdata/raw-bench features,
      # so the `lensfun`-gated code in `lumina-core` is not linted there. With
      # `liblensfun-dev` present in the container we lint that path explicitly
      # under `-D warnings`. Verified clean locally (liblensfun 0.3.4).
      - name: Run Clippy (lensfun feature)
        run: cargo clippy -p lumina-core --features lensfun -- -D warnings

      # onnx-rt is now CI-checked (image provides libssl-dev + clang for
      # openssl-sys; ort prebuilt binaries are fetched over network). Clippy
      # and tests for this feature run explicitly here. If the runner has no
      # network the build still at least `cargo check`s the crate (ort's
      # download-binaries step needs network; locally 91/105 tests are green,
      # the rest are network/model-artifact gated and fail closed without silent
      # fallback). CI runners do have network, so full `cargo test` is expected
      # green; `cargo clippy` is the lint gate.
      - name: Run Clippy (onnx-rt feature)
        run: cargo clippy -p lumina-onnx --features onnx-rt -- -D warnings

      - name: Check onnx-rt feature compiles
        run: cargo check -p lumina-onnx --features onnx-rt

      - name: Run onnx-rt tests
        run: cargo test -p lumina-onnx --features onnx-rt

      # The `gpu`-gated path in lumina-gpu cannot be runtime-tested in CI
      # (GitHub runners have no GPU/Metal compute). We at least compile-check
      # it here so that changes to the GPU code do not silently bit-rot.
      # Runtime GPU tests MUST be run locally (see Agents.md "GPU-Tests").
      # Only GPU remains hard CI-excluded; onnx-rt has no hardware reason.
      - name: Check GPU feature compiles
        run: cargo check -p lumina-gpu --features gpu

      - name: Check benchmark harness (all features)
        run: cargo check -p lumina-bench --all-features

  bench:
    name: Benchmarks (optional)
    needs: detect
    # Optional, NON-BLOCKING performance reporting. Core/Pipeline and Batch
    # benchmarks are pure-Rust (deterministic synthetic fixtures); the LibRaw
    # decode benches stay env-gated out of this fast set (see F-074 spec:
    # "Decode ... gehören nicht in das schnelle CI-Set"). Runs the same
    # pinned-LibRaw container as the rust job for environment consistency.
    # CI uses compare.mjs --mode warn ONLY (never the hard gate), so noisy
    # runners can never fail a merge. Budgets carry gate:true for a controlled
    # local gate on the capture machine, but CI deliberately does not enforce
    # it (CI-Runner-Rauschen-Regel). Bench steps are continue-on-error so the
    # job never breaks the main merge checks.
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reisi007/luminarust/lumina-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks (release, modest sampling)
        continue-on-error: true
        run: cargo bench -p lumina-bench -- --sample-size 50 --warm-up-time 2

      - name: Compare against baseline (warn mode, non-blocking)
        continue-on-error: true
        run: node scripts/perf/compare.mjs --mode warn --report-dir perf/results

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf/results/
          if-no-files-found: warn

  wasm:
    name: WASM checks
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check portable core and GUI
        run: |
          cargo check -p lumina-core --target wasm32-unknown-unknown
          # lumina-gui's default features (`lensfun`, `gpu`) are native-only;
          # the documented wasm32 capability boundary is the check WITHOUT
          # default features (see crates/lumina-gui/Cargo.toml).
          cargo check -p lumina-gui --target wasm32-unknown-unknown --no-default-features

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required planning documents
        run: |
          test -f Agents.md
          test -f Agents.todo.md
          test -f feature/README.md
          test -f feature/architecture/sidecar.md
          test -f feature/architecture/pipeline.md
          test -f feature/product/virtual-copies.md
          test -f feature/product/ai-masks.md
          test -f feature/platform/cli-gui-wasm.md
          test -f feature/platform/capability-matrix.md
          test -f feature/decisions.md
          test -f feature/architecture/pipeline.md
          test -f feature/quality/performance-benchmarks.md
          test -f docs/adr/0003-performance-benchmarking.md
          test -f docs/adr/README.md

      - name: Validate workflow syntax
        uses: raven-actions/actionlint@v2
