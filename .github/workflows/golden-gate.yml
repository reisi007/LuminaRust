name: Golden Gate

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: Produce and upload a golden-gate report artifact
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  golden:
    name: GUI goldens (ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/reisi007/luminarust/lumina-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # CI-GOLDEN-GATE-75: the lumina-ci image deliberately ships no Rust
      # toolchain (docker/Dockerfile: dtolnay/rust-toolchain installs the
      # current stable toolchain inside the job container), so this job must
      # install it itself — the same pattern as the rust-fast / rust-test-*
      # shards in ci.yml. Without these two steps the job dies with
      # "cargo: command not found" (exit 127) before any test runs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Same shared input as the rust-fast / rust-test-* shards.
          shared-key: lumina-rust-shards

      # NOTE: ubuntu-latest carries no GPU. kittest_snapshots needs a headless
      # wgpu adapter, so in the nightly a red/skip outcome here is the expected
      # visible result — green would be the silent lie. The first real adapter
      # run (GPU-runner job, or a documented manual run with command, platform
      # and result file) is still open; it stays tracked under GOLDEN-REF-30 /
      # GOLDEN-BASELINE-32.
      - name: Run ignored GUI golden tests
        id: gold
        shell: bash
        run: |
          set -o pipefail
          LOG="$PWD/golden-gate.log"
          cargo test -p lumina-gui --test kittest_snapshots -- --ignored --test-threads=1 2>&1 | tee "$LOG"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload golden-gate report
        if: ${{ inputs.report != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-gate-log
          path: golden-gate.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Record a non-silent result
        if: always()
        shell: bash
        run: |
          echo "GOLDEN-GATE-62: ignored GUI golden run, schedule/dispatch-triggered."
          echo "Result class (DoD §12): 'laeuft' only if exit 0 and test count > 0."
          echo "CI-GOLDEN-GATE-75: this runner has no wgpu adapter (container without GPU/Mesa); the pinned golden platform is macOS/Metal (scripts/golden_ref.lock), so a red result here is the documented, non-silent state — see feature/quality/golden-references.md §10."
          test "${{ steps.gold.outputs.exit_code }}" = "0"
