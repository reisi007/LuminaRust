[workspace]

[package]
name = "agent-harness"
version = "0.1.0"
edition = "2021"
description = "Standalone instrumenting GUI harness for LuminaRust open GUI tasks (headless kittest, no production code touched)"

[dependencies]
lumina-gui = { path = "../crates/lumina-gui" }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tempfile = "3"

[dev-dependencies]

[patch.crates-io]
# Same vendored macOS C++ fix as the main workspace (libraw-sys 0.1.1
# forwards pkg-config's C++ runtime metadata verbatim otherwise).
libraw-sys = { path = "../vendor/libraw-sys" }

[[test]]
name = "toast_overlap"
path = "tests/toast_overlap.rs"

[[test]]
name = "zoom_custom"
path = "tests/zoom_custom.rs"

[[test]]
name = "right_thumb"
path = "tests/right_thumb.rs"

[[test]]
name = "filmstrip_dup"
path = "tests/filmstrip_dup.rs"

[[test]]
name = "nav_rect"
path = "tests/nav_rect.rs"

[[test]]
name = "preview_noise"
path = "tests/preview_noise.rs"

[[test]]
name = "sidecar_restore"
path = "tests/sidecar_restore.rs"

[[test]]
name = "optics"
path = "tests/optics.rs"

[[test]]
name = "subfolders"
path = "tests/subfolders.rs"

[[test]]
