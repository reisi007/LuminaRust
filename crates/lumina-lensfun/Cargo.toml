[package]
name = "lumina-lensfun"
version = "0.1.0"
edition = "2021"
publish = false
description = "Safe Rust wrapper around the system liblensfun (LGPL-3.0) for automatic lens correction (F-098-N1)"

# `native` is OFF by default. Without it the crate compiles to an empty library
# with no link dependencies, so default and CI builds stay green even
# when liblensfun is not installed on the machine.
[features]
native = []

# No runtime dependencies: the FFI is hand-written `extern "C"` bindings and
# `build.rs` only shells out to `pkg-config` (std only) — no bindgen, no cc,
# no new crates.
[build-dependencies]

[dependencies]

[lib]
path = "src/lib.rs"
