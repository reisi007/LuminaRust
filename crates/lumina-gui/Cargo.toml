[package]
name = "lumina-gui"
version = "0.1.0"
edition = "2021"
description = "Native desktop Lumina raster preview GUI"

[dependencies]
blake3 = "1"
# GUI-WGPU-PRESENT-1: native desktop uses the **wgpu** renderer (was `glow`)
# so `lumina-gpu`'s VRAM textures live on the same device that presents to the
# swapchain — enabling the readback-free present path (`copy_vram_to_texture`
# → registered egui user texture). The lumina-gpu capability stays
# feature-gated (see `gpu` below).
eframe = { version = "0.36", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
serde_json = "1"
# F-009: the `<name>.lumina-preset.json` envelope (`presets::PresetFile`) is
# defined in the GUI and derives Serialize/Deserialize around the sidecar
# `Preset` structure.
serde = { version = "1", features = ["derive"] }
lumina-core = { path = "../lumina-core" }
lumina-raw = { path = "../lumina-raw" }
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }
thiserror = "2"
log = "0.4"
# GPU-first render path. Optional so lean builds can omit the wgpu/Metal
# dependency; the desktop default enables it via the `gpu` feature below.
lumina-gpu = { path = "../lumina-gpu", optional = true }
rfd = "0.17"

[features]
# All GUI features are ON by default for the native desktop (Tester-Wunsch).
# F-098-N1: Lensfun pipeline (native liblensfun).
default = ["lensfun", "gpu"]
lensfun = ["lumina-core/lensfun"]
# GPU-first rendering via `lumina-gpu` (wgpu/Metal). Enabled by default on
# desktops; `--no-default-features` drops the wgpu stack and its native
# dependencies.
gpu = ["lumina-gpu", "dep:bytemuck"]

[dependencies.bytemuck]
version = "1"
optional = true

[dev-dependencies]
tempfile = "3"
# F-103-N9: headless UI snapshot regression tests via egui_kittest.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
# PREVIEW-CACHE-FEATURE (F-074): Criterion bench for the hybrid neighbor preview
# cache primitives (WebP hit/miss, RAM-LRU hit, prefetch-window planning). The
# harness is a native-only target (`harness = false`, ADR 0003 spirit — see
# feature/quality/preview-cache.md, Akzeptanzkriterium 8).
criterion = "0.8"

[[bench]]
name = "preview_cache"
harness = false
path = "benches/preview_cache.rs"
