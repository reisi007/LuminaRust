[package]
name = "lumina-gui"
version = "0.1.0"
edition = "2021"
description = "Native and WASM Lumina raster preview GUI"

[dependencies]
blake3 = "1"
# GUI-WGPU-PRESENT-1: native desktop uses the **wgpu** renderer (was `glow`)
# so `lumina-gpu`'s VRAM textures live on the same device that presents to the
# swapchain — enabling the readback-free present path (`copy_vram_to_texture`
# → registered egui user texture). WASM builds compile the wgpu backend too
# (WebGL2/WebGPU); the lumina-gpu capability stays native-only via features.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
serde_json = "1"
lumina-core = { path = "../lumina-core" }
lumina-raw = { path = "../lumina-raw" }
lumina-sidecar = { path = "../lumina-sidecar" }
thiserror = "2"
log = "0.4"
# GPU-first render path. Optional so wasm32 can omit it entirely (no wgpu/Metal
# dependency); native desktop enables it via the `gpu` feature below.
lumina-gpu = { path = "../lumina-gpu", optional = true }

[features]
# All GUI features are ON by default for the native desktop (Tester-Wunsch).
# F-098-N1: Lensfun pipeline (native liblensfun). For wasm32 use
# `cargo build --target wasm32-unknown-unknown --no-default-features` to avoid
# pulling the native C dependency (this also drops `lumina-gpu`).
default = ["lensfun", "gpu"]
lensfun = ["lumina-core/lensfun"]
# GPU-first rendering via `lumina-gpu` (wgpu/Metal). Enabled by default on native
# desktops; wasm32 builds use `--no-default-features` so the wgpu stack and its
# native dependencies are never pulled.
gpu = ["lumina-gpu", "dep:bytemuck"]

[dependencies.bytemuck]
version = "1"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "HtmlCanvasElement", "Window"] }

[dev-dependencies]
tempfile = "3"
# F-103-N9: headless UI snapshot regression tests via egui_kittest.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
