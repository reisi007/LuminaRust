[package]
name = "lumina-onnx"
version = "0.1.0"
edition = "2021"
description = "Native ONNX inference adapter for Lumina (BiRefNet subject model + exchangeable backend)"
publish = false

[dependencies]
lumina-core = { path = "../lumina-core" }
lumina-sidecar = { path = "../lumina-sidecar" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Model-artifact identity hash. SHA-256 is the documented `model_hash`
# algorithm for mask identity (feature/product/ai-masks.md, F-082:
# "`model_hash` = Artefakt-SHA256"). Computed locally from committed/local
# artifacts only — no downloads.
sha2 = "0.11"

# Real ONNX Runtime backend. OPTIONAL and gated behind the non-default
# `onnx-rt` feature so the default build/test stays green with no network
# access. `ort` v2.0.0-rc.13 is fetchable and builds in this environment
# (including its prebuilt-binary download); see README.md for the landing plan.
# R2-SIDECAR-ZDATA-WASM / FOLLOWUP-WASM-ZDATA-CONSUMER: `ort` (via `ort-sys`) has
# no wasm32 prebuilt binaries, so it is target-gated to non-wasm32. On wasm32
# the `onnx-rt` feature therefore resolves to the wasm stub (`wasm_stub.rs`)
# and never pulls `ort-sys` into the wasm dependency graph; `cargo check
# --target wasm32-unknown-unknown --features onnx-rt` stays green and reports
# `RuntimeDisabled` instead of a native build-script failure.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ort]
version = "=2.0.0-rc.13"
optional = true

[features]
default = []
# Enables the real ONNX Runtime (`ort`) backend. Requires network at build time
# to fetch prebuilt ONNX Runtime binaries and a real `.onnx` artifact at runtime.
onnx-rt = ["dep:ort"]
