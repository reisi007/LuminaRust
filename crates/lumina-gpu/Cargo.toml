[package]
name = "lumina-gpu"
version = "0.1.0"
edition = "2021"
description = "GPU-first rendering path for Lumina (wgpu/Metal), with a CPU fallback"

[dependencies]
# Platform-neutral core provides the `ImageFrame` type and the complete CPU
# reference (`lumina_core::render_frame`, via the local `render_cpu`), which
# `lumina-gpu` relies on whenever no GPU adapter is available (or when the
# `gpu` feature is disabled). The core crate stays free of any GPU/native
# dependency per `Agents.md`.
lumina-core = { path = "../lumina-core" }
lumina-sidecar = { path = "../lumina-sidecar" }
# GPU-LENSFUN-PARITY-1: the strict Lensfun corrector map builder (hermetic tests)
# and the parity harness need the native wrapper only under the `lensfun`
# feature; default builds stay dependency-free of liblensfun.
lumina-lensfun = { path = "../lumina-lensfun", optional = true, default-features = false }
thiserror = "2"
# Logging for the bootstrap stubs (no-op unless a logger is installed).
log = "0.4"
# Runtime validation of legacy `extras["spot_removals"]` JSON geometry at the
# GPU entry (validate.rs), parsed with the same `serde_json::Value` type the
# sidecar recipe stores it in. Already a `lumina-sidecar` dependency resolved in
# the workspace lockfile.
serde_json = "1"
# GPU backend dependencies. Optional + feature-gated so a
# `--no-default-features` build stays dependency-light for headless CI.
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1.0", optional = true }

[features]
# Primary GPU path for native desktop (Metal on Apple Silicon, Vulkan/DX12
# elsewhere). Enabled by default so a plain `cargo build -p lumina-gpu` pulls
# in the wgpu stack and the adapter/device init below compiles. Disable it with
# `--no-default-features` to get a pure-CPU build.
default = ["gpu"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
# GPU-LENSFUN-PARITY-1 hermetic tests: enables the `lumina-core` `lensfun`
# feature (the `LensfunMap::from_corrector` builder) and the native
# `lumina-lensfun` wrapper. NOT default — default builds never link liblensfun.
lensfun = ["lumina-core/lensfun", "dep:lumina-lensfun", "lumina-lensfun/native"]
# Opt-in gate for the adapter-dependent integration tests. Without it those
# tests carry `#[ignore]`, so a plain `cargo test -p lumina-gpu` (as CI runs it
# on a GPU-less runner) reports them as **ignored** rather than vacuously
# passing. With it they are real tests and a missing adapter is a hard failure
# (`tests/support`). Run the real GPU suite locally with:
#   cargo test -p lumina-gpu --features gpu-adapter-tests
gpu-adapter-tests = ["gpu"]

[dev-dependencies]
# Used by the golden-image equivalence harness to report a blake3 content hash
# of the CPU and GPU render outputs. Already resolved in the workspace lockfile
# (consumed by lumina-core/cli/gui), so this adds no new transitive dependency.
blake3 = "1"
