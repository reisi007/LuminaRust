[package]
name = "lumina-core"
version = "0.1.0"
edition = "2021"
description = "Portable Lumina raster decoding and recipe rendering"

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lumina-sidecar = { path = "../lumina-sidecar" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
