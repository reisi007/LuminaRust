[package]
name = "lumina-core"
version = "0.1.0"
edition = "2021"
description = "Portable Lumina raster decoding and recipe rendering"

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lumina-sidecar = { path = "../lumina-sidecar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# PERF-GUI: optional multi-threaded pixel pass. Kept optional + feature-gated so
# the default build stays green; native desktops opt in via
# `lumina-core/parallel` (see `lumina-gui`).
rayon = { version = "1", optional = true }
lumina-lensfun = { path = "../lumina-lensfun", optional = true, default-features = false }

[features]
# PERF-GUI-* (CPU quick-wins): parallelize the per-pixel adjustment passes with
# `rayon::par_chunks_exact_mut(4)`. Platform-neutral (no GPU/wgpu); enabled only
# on native desktops. Never default.
parallel = ["dep:rayon"]
# Enables automatic lens correction via the system Lensfun database (native
# LGPL-3.0 C library, dynamically linked). Also pulls in the crate's `native`
# feature so the FFI bindings and `liblensfun` linkage are active.
lensfun = ["dep:lumina-lensfun", "lumina-lensfun/native"]

[dev-dependencies]
proptest = "1"
