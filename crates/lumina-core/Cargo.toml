[package]
name = "lumina-core"
version = "0.1.0"
edition = "2021"
description = "Portable Lumina raster decoding and recipe rendering"

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lumina-sidecar = { path = "../lumina-sidecar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# F-098-N1: optional, feature-gated Lensfun integration. Never default and never
# WASM-linked — without the `lensfun` feature this dependency is not compiled,
# so default and `wasm32` builds stay green without `liblensfun`.
lumina-lensfun = { path = "../lumina-lensfun", optional = true, default-features = false }

[features]
# Enables automatic lens correction via the system Lensfun database (native
# LGPL-3.0 C library, dynamically linked). Also pulls in the crate's `native`
# feature so the FFI bindings and `liblensfun` linkage are active.
lensfun = ["dep:lumina-lensfun", "lumina-lensfun/native"]

[dev-dependencies]
proptest = "1"
