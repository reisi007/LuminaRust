[package]
name = "lumina-stages"
version = "0.1.0"
edition = "2021"
description = "Shared session-based recipe stage editors (spot, lens-blur, geometry, upright) for the CLI and the MCP server"
publish = false

# MCP-PARITY-A: this crate exists so the four session-based recipe stage editors
# have exactly ONE implementation. `lumina-cli` (`spot`, `lens-blur`,
# `geometry`, `upright`) and `lumina-mcp` (`lumina_spot`, `lumina_lens_blur`,
# `lumina_geometry`, `lumina_upright`) both call the same `run()` functions
# below, so an MCP call and the equivalent CLI call cannot drift. It is
# deliberately NOT reachable from `lumina-cli` alone: a package cycle
# (`lumina-cli` -> `lumina-mcp` -> `lumina-cli`) is rejected by Cargo, so the
# shared logic has to live in a third crate.
[dependencies]
blake3 = "1"
log = "0.4"
lumina-core = { path = "../lumina-core" }
# MCP-PARITY-B: `generative` produces its canvas through the same
# `lumina_onnx::produce_canvas` the CLI uses, and `regenerate` re-derives
# `matched_exposure` from the same render choke point. Moving the command into
# this crate therefore also moves its model call — a second, MCP-side producer
# would be exactly the divergence the byte-identity requirement forbids.
# MCP-PARITY-C / Impl-A: the shared merge decode + exposure adapter
# (`src/merge.rs`) feeds the frontend-independent orchestration
# `lumina_merge::bundle::run_merge` and needs its contract types
# (`MergeSourceFrame`, `MergeRunError`, `linear_from_rgba`, `merge_checksum`).
# No package cycle: `lumina-merge` depends only on core/sidecar
# (+ blake3, serde_json, thiserror, log, tempfile, tiff), never on this crate.
lumina-merge = { path = "../lumina-merge" }
lumina-onnx = { path = "../lumina-onnx" }
lumina-raw = { path = "../lumina-raw" }
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] } # JSON-ROUNDTRIP (AGENTS.md, entschieden 2026-10-02)
# MCP-PARITY-C / Impl-A: the shared matrix runner stages golden/export/diff
# bytes atomically (same `.{name}.tmp-*` + fsync + rename scheme the CLI used)
# and owns the default temporary work directory.
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
