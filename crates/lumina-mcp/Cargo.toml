[package]
name = "lumina-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) server exposing LuminaRust editing as agent tools"
publish = false

[dependencies]
lumina-core = { path = "../lumina-core" }
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }
lumina-iptc = { path = "../lumina-iptc" }
# MCP-PARITY-A: the ONE implementation of the four session-based recipe stage
# editors (`lumina_spot`, `lumina_lens_blur`, `lumina_geometry`,
# `lumina_upright`). `lumina-cli` depends on the same crate, so an MCP call and
# the equivalent CLI call cannot drift; `crates/lumina-cli/tests/stage_parity.rs`
# proves the byte identity. A package cycle (`lumina-cli` -> `lumina-mcp` ->
# `lumina-cli`) is rejected by Cargo, which is why the shared code lives in a
# third crate.
lumina-stages = { path = "../lumina-stages" }
lumina-raw = { path = "../lumina-raw" }
# MCP-PARITY-C: the shared merge orchestration `lumina_merge::bundle::run_merge`
# that `lumina merge-hdr` / `lumina merge-pano` (CLI) and the GUI actions call —
# the MCP tools `lumina_merge_hdr` / `lumina_merge_pano` call the very same
# function over the very same decode adapter (`lumina_stages::merge`), so no
# second merge implementation exists. No package cycle: `lumina-merge` depends
# only on core/sidecar (+ blake3, serde_json, thiserror, log, tempfile, tiff),
# never on `lumina-mcp`.
lumina-merge = { path = "../lumina-merge" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] } # JSON-ROUNDTRIP (Agents.md, entschieden 2026-10-02)
blake3 = "1"
# Logging for backend selection + the `LUMINA_MCP_LOG` level filter.
# `std` is required for `log::set_boxed_logger` (log 0.4 has no default features).
log = { version = "0.4", features = ["std"] }
# GPU-first rendering path (wgpu/Metal), optional capability. Enables
# `GpuContext` routing in `util.rs`; degrades to the CPU pipeline otherwise.
lumina-gpu = { path = "../lumina-gpu", optional = true }

[features]
# F-098-N1: enables the Lensfun pipeline path in lumina-core and pulls the
# native liblensfun (default OFF).
lensfun = ["lumina-core/lensfun"]
# GPU-first rendering with CPU fallback (lumina-gpu, wgpu/Metal). The MCP render
# choke point prefers the GPU adapter and falls back to the CPU pipeline.
gpu = ["dep:lumina-gpu"]

[dev-dependencies]
tempfile = "3"

