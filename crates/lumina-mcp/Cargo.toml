[package]
name = "lumina-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) server exposing LuminaRust editing as agent tools"
publish = false

[dependencies]
lumina-core = { path = "../lumina-core" }
# `zdata` (native `.lumina.zdata` bundle codec via zstd) is native-only.
# On wasm32 the codec is unavailable — dust_removal reports "not available".
# The feature is therefore enabled only for non-wasm32 targets so a
# workspace-wide `cargo check --target wasm32-unknown-unknown` never pulls
# `zstd-sys` via this crate, even though the native MCP build uses `zdata`.
lumina-sidecar = { path = "../lumina-sidecar" }
lumina-raw = { path = "../lumina-raw" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# Logging for backend selection + the `LUMINA_MCP_LOG` level filter.
# `std` is required for `log::set_boxed_logger` (log 0.4 has no default features).
log = { version = "0.4", features = ["std"] }
# GPU-first rendering path (wgpu/Metal), optional capability. Enables
# `GpuContext` routing in `util.rs`; degrades to the CPU pipeline otherwise.
lumina-gpu = { path = "../lumina-gpu", optional = true }

[features]
# F-098-N1: enables the Lensfun pipeline path in lumina-core and pulls the
# native liblensfun (default OFF).
lensfun = ["lumina-core/lensfun"]
# GPU-first rendering with CPU fallback (lumina-gpu, wgpu/Metal). The MCP render
# choke point prefers the GPU adapter and falls back to the CPU pipeline.
gpu = ["dep:lumina-gpu"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }
