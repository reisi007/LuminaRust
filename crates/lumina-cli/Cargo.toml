[package]
name = "lumina-cli"
version = "0.1.0"
edition = "2021"
description = "Headless Lumina raster MVP"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
blake3 = "1"
lumina-core = { path = "../lumina-core" }
lumina-raw = { path = "../lumina-raw" }
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
