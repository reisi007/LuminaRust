[package]
name = "lumina-cli"
version = "0.1.0"
edition = "2021"
description = "Headless Lumina raster MVP"

[dependencies]
clap = { version = "4", features = ["derive"] }
blake3 = "1"
lumina-core = { path = "../lumina-core" }
lumina-sidecar = { path = "../lumina-sidecar" }
serde_json = "1"
tempfile = "3"
thiserror = "2"
