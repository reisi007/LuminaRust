[package]
name = "lumina-cli"
version = "0.1.0"
edition = "2021"
description = "Headless Lumina raster MVP"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
blake3 = "1"
lumina-core = { path = "../lumina-core" }
lumina-raw = { path = "../lumina-raw" }
lumina-onnx = { path = "../lumina-onnx" }
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[features]
# F-098-N1: enables the Lensfun pipeline path in lumina-core and pulls the
# native liblensfun (default OFF; requires the system library when enabled).
lensfun = ["lumina-core/lensfun"]
