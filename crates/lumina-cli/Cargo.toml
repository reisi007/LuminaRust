[package]
name = "lumina-cli"
version = "0.1.0"
edition = "2021"
description = "Headless Lumina raster MVP"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
blake3 = "1"
lumina-core = { path = "../lumina-core" }
lumina-raw = { path = "../lumina-raw" }
lumina-onnx = { path = "../lumina-onnx" }
lumina-sidecar = { path = "../lumina-sidecar", features = ["zdata"] }
# F-098-N2: optional Lensfun dependency so the CLI can build a corrector from
# EXIF metadata. Only compiled/linked when the `lensfun` feature is on.
lumina-lensfun = { path = "../lumina-lensfun", optional = true, default-features = false }
# GPU-first rendering path (wgpu/Metal). Optional: when the `gpu` feature is
# enabled, render/export/batch prefer the GPU adapter and fall back to the CPU
# pipeline otherwise. Disabled by default so headless CI stays dependency-light.
lumina-gpu = { path = "../lumina-gpu", optional = true }
# Logging for visible backend selection (see `Agents.md` capability separation).
# `std` is required for `log::set_boxed_logger` (log 0.4 has no default features).
log = { version = "0.4", features = ["std"] }
# F-101-F1: `lumina mcp` subcommand runs the MCP server over stdio. Optional
# capability (SOLL: feature-flagged integration); enabled by default so the
# standard workspace build/test gates cover the subcommand.
lumina-mcp = { path = "../lumina-mcp", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[features]
default = ["mcp"]
# F-101-F1: enables the `lumina mcp` stdio-server subcommand.
mcp = ["dep:lumina-mcp"]
# GPU-first rendering with CPU fallback (lumina-gpu, wgpu/Metal). Enables the
# `GpuContext` routing in `main.rs`; the GPU path is an optional capability that
# degrades to the CPU pipeline when no adapter is present.
gpu = ["dep:lumina-gpu"]
# F-098-N1/N2: enables the Lensfun pipeline path in lumina-core and the CLI
# EXIF→Corrector wiring, and pulls the native liblensfun (default OFF; requires
# the system library when enabled).
lensfun = ["lumina-core/lensfun", "lumina-lensfun/native"]
# F-082-FOLLOWUP: real ONNX Runtime engine for mask re-inference (forwards to
# `lumina-onnx/onnx-rt`, `ort`). Non-default and network-gated (prebuilt ONNX
# Runtime binaries). WITHOUT it the CLI wires the deterministic StubBackend
# (documented default); WITH it the CLI requests the real engine via the
# `LUMINA_MODEL_PATH` artifact and fails hard when the artifact is unusable —
# never a silent stub substitute.
onnx-rt = ["lumina-onnx/onnx-rt"]
