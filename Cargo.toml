[workspace]
resolver = "2"
members = ["crates/lumina-sidecar", "crates/lumina-core", "crates/lumina-raw", "crates/lumina-onnx", "crates/lumina-cli", "crates/lumina-gui", "crates/lumina-bench"]

[patch.crates-io]
# libraw-sys 0.1.1 forwards pkg-config's C++ runtime metadata verbatim. The
# vendored build script maps `stdc++` to Apple's `c++` only for macOS; Linux and
# other native targets retain pkg-config's link name.
libraw-sys = { path = "vendor/libraw-sys" }
